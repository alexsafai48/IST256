<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Cards</title>
    <script type="module" src="./my-card.js"></script>

    <style>
      .wrapper {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      my-card[fancy] {
        --my-card-fancy-bg: #e6f7ff;
        --my-card-fancy-border: #1890ff;
        --my-card-fancy-shadow: rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="wrapper">

      <my-card
        title="Robot One"
        image="https://m.media-amazon.com/images/M/MV5BMTEzODY5ODYtMTIxMi00Yjg5LTk2ZjMtMzI1YTAzOGQzYWZkXkEyXkFqcGc@._V1_QL75_UX291_.jpg"
        link="https://hax.psu.edu"
        fancy
        label="Learn More">
        <p>The  <strong>original</strong> robot</p>
      </my-card>

      <my-card
        title="Bender"
        image="https://oyster.ignimgs.com/mediawiki/apis.ign.com/futurama/5/51/Bender.jpg"
        link="https://en.wikipedia.org/wiki/Bender_(Futurama)">
        <p>Bender bender bender</p>
      </my-card>

      <my-card
        title="Wall-E"
        image="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUoKd6d6NYN0-3psNMW-661MEYzUE36nBt_g&s"
        link="https://pixar.com"
        fancy>
        <p>Wall-E go home or something</p>
      </my-card>

    </div>
  </body>
</html>
